[package]
name = "vera-nsm"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
openssl = "=0.10.81"
zeroize = "=1.8.2"

[target.'cfg(target_os = "linux")'.dependencies]
aws-nitro-enclaves-nsm-api = "=0.5.2"

nix = { version = "=0.31.3", default-features = false, features = ["ioctl"] }

[build-dependencies]
cc = "=1.4.6"
pkg-config = "=0.3.34"

name: vera-ipfs-archive-review
services:
  first:
    image: vera-enclave-ipfs-local-enclave:latest
    environment: &enclave_environment
      ENCLAVE_IPFS_ENABLED: '1'
      ENCLAVE_LOCAL_IPFS_TEST: '1'
      NODE_ENV: development
    ports: ['127.0.0.1:15012:5002']
    tmpfs: ['/app/ipfs:uid=1000,gid=1000']
    mem_limit: 768m
    pids_limit: 128
    healthcheck: &enclave_health
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:5002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 30
  replacement:
    image: vera-enclave-ipfs-local-enclave:latest
    environment: *enclave_environment
    ports: ['127.0.0.1:15013:5002']
    tmpfs: ['/app/ipfs:uid=1000,gid=1000']
    mem_limit: 768m
    pids_limit: 128
    healthcheck: *enclave_health
  archive:
    image: localstack/localstack:4.10.0
    environment:
      SERVICES: s3
    ports: ['127.0.0.1:15466:4566']
    mem_limit: 512m
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 3s
      timeout: 2s
      retries: 30

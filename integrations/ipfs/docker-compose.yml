name: vera-enclave-ipfs-local
services:
  enclave:
    build:
      context: ../../enclave
    environment:
      ENCLAVE_IPFS_ENABLED: '1'
      ENCLAVE_LOCAL_IPFS_TEST: '1'
      NODE_ENV: development
    ports:
      - '127.0.0.1:15002:5002'
    volumes:
      - ciphertext:/app/ipfs
    mem_limit: 768m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:5002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 30
volumes:
  ciphertext:
